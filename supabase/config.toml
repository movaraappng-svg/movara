project_id = "movara"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false

[auth]
enabled = true
site_url = "https://movaraappng-svg.github.io/movara/"
additional_redirect_urls = [
  "https://movaraappng-svg.github.io/movara/**",
  "http://localhost:5173/**",
  "http://127.0.0.1:5173/**",
  "movara://auth/callback",
]
enable_signup = true

[storage]
enabled = true
file_size_limit = "50MiB"

[studio]
enabled = true

[functions.paystack-webhook]
verify_jwt = false

[functions.shared-ride]
verify_jwt = false
