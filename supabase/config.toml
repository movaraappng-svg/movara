project_id = "movara"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 15

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:8080"
additional_redirect_urls = [
  "http://localhost:8080/**",
  "http://localhost:60948/**",
]
enable_signup = true

[storage]
enabled = true
file_size_limit = "10MiB"

[studio]
enabled = true

[functions.paystack-webhook]
verify_jwt = false

[functions.shared-ride]
verify_jwt = false
